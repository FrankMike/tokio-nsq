services:
  nsq:
    image: nsqio/nsq
    restart: always
    ports:
      - "4150:4150"
    volumes:
      - ./keys:/keys:ro
    command: /nsqd --broadcast-address=localhost --lookupd-tcp-address=nsqlookupd:4160
    depends_on:
      - nsqlookupd

  nsqwithauth:
    image: nsqio/nsq
    restart: always
    ports:
      - "4151:4150"
    volumes:
      - ./keys:/keys:ro
    command: /nsqd --broadcast-address=localhost --auth-http-address=nsqauth:8080 --tls-cert=/keys/cert.pem --tls-key=/keys/key.pem --tls-required=true
    depends_on:
      - nsqauth

  nsqlookupd:
    image: nsqio/nsq
    restart: always
    ports:
      - "4161:4161"
    command: /nsqlookupd

  nsqadmin:
    image: nsqio/nsq
    restart: always
    command: /nsqadmin --lookupd-http-address=nsqlookupd:4161
    depends_on:
      - nsqlookupd

  nsqauth:
    image: node
    working_dir: "/app"
    restart: always
    volumes:
      - .:/app:ro
    command: node auth.js

  dev:
    image: rust
    working_dir: "/app"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app:rw
    command: tail -f /dev/null
